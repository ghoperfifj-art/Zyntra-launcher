[package]
name = "zyntra"
version = "0.1.2"
edition = "2021"
description = "Zyntra Launcher — лёгкий лаунчер Minecraft без рекламы, с поддержкой Horizon"
license = "MIT"
repository = "https://github.com/ghoperfifj-art/Zyntra-launcher-"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rayon = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[build-dependencies]
winresource = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
